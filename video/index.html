    <script>
      const tl = gsap.timeline({ paused: true });
      // punch-ins on footage wrappers (never on the timed <video>)
      const punch = (id, t, from = 1.12, dur = 0.45, origin = "50% 50%") => {
        tl.fromTo(id, { scale: from, transformOrigin: origin }, { scale: 1, duration: dur, ease: "expo.out" }, t);
      };
      punch("#w-h1", 0, 1.18, 0.5);
      punch("#w-h2", 1.633, 1.15);
      punch("#w-intro", 3.233, 1.08, 0.6);
      punch("#w-box1", 5.333, 1.1);
      punch("#w-box2", 6.4, 1.1);
      punch("#w-box3", 7.467, 1.1);
      punch("#w-hex", 11.7, 1.12);
      punch("#w-grip", 13.3, 1.1);
      // floor: slow push toward the dumbbells standing on the ground
      tl.fromTo("#w-floor", { scale: 1, transformOrigin: "50% 92%" }, { scale: 1.22, duration: 2.1, ease: "power2.inOut" }, 14.9);
      ["#w-m1", "#w-m2", "#w-m3", "#w-m4", "#w-m5", "#w-m6", "#w-m7", "#w-m8"].forEach((id, i) => {
        const starts = [17, 18.1, 19.133, 20.2, 21.267, 22.333, 23.4, 24.467];
        punch(id, starts[i], 1.14, 0.35);
      });
      tl.fromTo("#w-cta", { scale: 1.06 }, { scale: 1.16, duration: 7.5, ease: "none" }, 25.5);
      // white flash on the drop
      tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, 17);
            window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
